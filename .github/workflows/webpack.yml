name: WKWebView

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs: native
  build: Webkit
    runs-on: macOS

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
